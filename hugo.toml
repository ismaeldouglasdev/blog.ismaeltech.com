baseURL = "https://blog.ismaeltech.com"
languageCode = "pt-BR"
title = "ismaeldev</>"
theme = "PaperMod"

defaultContentLanguage = "pt"
defaultContentLanguageInSubdir = false

[languages]
  [languages.pt]
    languageName = "Português"
    languageCode = "pt-BR"
    weight = 1
  [languages.en]
    languageName = "English"
    weight = 2
    [languages.en.params]
      description = "Articles about web development, systems, automation and technology by Ismael Douglas"
      [languages.en.params.homeInfoParams]
        Title = "Ismael Douglas"
        Content = "Articles about web development, custom systems, automation and technology. I write about what I build and what I learn."

enableRobotsTXT = true
buildDrafts = false

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      # Posts usam HTML cru (<figure>, <img>, <details>, <table>) que o
      # goldmark descarta por padrão — sem isso imagens e figuras somem.
      unsafe = true

[pagination]
  pagerSize = 10

[params]
  description = "Artigos sobre desenvolvimento web, sistemas, e tecnologia por Ismael Douglas"
  author = "Ismael Douglas"
  ShowCodeCopyButtons = true
  ShowReadingTime = true
  ShowShareButtons = true
  DateFormat = "02/01/2006"
  defaultTheme = "light"
  disableThemeToggle = false

  [params.homeInfoParams]
    Title = "Ismael Douglas"
    Content = "Artigos sobre desenvolvimento web, sistemas sob medida, automação e tecnologia. Escrevo sobre o que construo e o que aprendo."

  # Comentários: layouts/partials/comments.html (Cloudflare Worker + D1)

  [params.related]
    includeNewer = true
    threshold = 1
    toLower = true
    indices = [
      { name = "tags", weight = 100 },
      { name = "categories", weight = 70 },
    ]

[outputs]
  home = ["HTML", "RSS", "JSON", "search"]

[outputFormats]
  [outputFormats.search]
    mediatype = "application/json"
    baseName = "index"
    isPlainText = false
    notAlternative = true

[taxonomies]
  tag = "tags"

[[languages.pt.menu.main]]
  name = "Início"
  url = "/"
  weight = 1

[[languages.pt.menu.main]]
  name = "Posts"
  url = "/posts/"
  weight = 2

[[languages.pt.menu.main]]
  name = "Tags"
  url = "/tags/"
  weight = 3

[[languages.pt.menu.main]]
  name = "Sobre"
  url = "https://ismaeltech.com/#sobre"
  weight = 4

[[languages.en.menu.main]]
  name = "Home"
  url = "/en/"
  weight = 1

[[languages.en.menu.main]]
  name = "Posts"
  url = "/en/posts/"
  weight = 2

[[languages.en.menu.main]]
  name = "Tags"
  url = "/en/tags/"
  weight = 3

[[languages.en.menu.main]]
  name = "About"
  url = "https://ismaeltech.com/#sobre"
  weight = 4
