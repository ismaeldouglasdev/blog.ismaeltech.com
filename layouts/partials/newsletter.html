<aside class="newsletter-box" id="newsletter" role="dialog" aria-labelledby="newsletter-title">
  <button type="button" class="newsletter-close" id="newsletter-close" aria-label="{{ i18n "newsletter_close" | default "Fechar newsletter" }}">&times;</button>
  <h3 id="newsletter-title">{{ i18n "newsletter_title" | default "Receba novos posts por e-mail" }}</h3>
  <p class="newsletter-desc">{{ i18n "newsletter_desc" | default "Conteúdo prático sobre desenvolvimento, carreira e tecnologia. Sem spam. Cancele quando quiser." }}</p>
  <form id="newsletter-form" class="newsletter-form" novalidate>
    <input type="text" name="website" tabindex="-1" autocomplete="off" class="newsletter-hp" aria-hidden="true">
    <input type="email" name="email" required placeholder="{{ i18n "newsletter_email_ph" | default "Seu e-mail" }}" aria-label="E-mail">
    <button type="submit" id="newsletter-submit">{{ i18n "newsletter_submit" | default "Inscrever-se" }}</button>
  </form>
  <p id="newsletter-msg" class="newsletter-msg" role="status" aria-live="polite"></p>
</aside>
<script>
(function() {
  var box = document.getElementById('newsletter');
  var storageKey = 'newsletter-dismissed';
  function hide() {
    if (!box) return;
    box.hidden = true;
    box.style.display = 'none';
  }
  function dismiss() {
    hide();
    try { window.localStorage.setItem(storageKey, '1'); } catch (err) {}
  }
  if (box) {
    var dismissed = false;
    try { dismissed = window.localStorage.getItem(storageKey) === '1'; } catch (err) {}
    if (dismissed) hide();
    document.addEventListener('click', function(e) {
      if (e.target && e.target.closest && e.target.closest('#newsletter-close')) dismiss();
    });
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape' && !box.hidden) dismiss();
    });
  }
  var form = document.getElementById('newsletter-form');
  if (!form) return;
  var msg = document.getElementById('newsletter-msg');
  var btn = document.getElementById('newsletter-submit');
  var endpoint = 'https://opt-out.ismaeltech.com/api/newsletter/subscribe';
  form.addEventListener('submit', async function(e) {
    e.preventDefault();
    var email = (form.email.value || '').trim();
    if (!email) return;
    btn.disabled = true;
    msg.textContent = '{{ i18n "newsletter_sending" | default "Enviando..." }}';
    msg.className = 'newsletter-msg';
    try {
      var res = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email, website: form.website.value || '', source: 'blog:' + window.location.pathname })
      });
      var data = await res.json().catch(function(){ return {}; });
      if (res.ok && data.ok) {
        msg.textContent = '{{ i18n "newsletter_success" | default "Quase lá! Verifique seu e-mail para confirmar a inscrição." }}';
        msg.className = 'newsletter-msg ok';
        form.reset();
      } else {
        msg.textContent = '{{ i18n "newsletter_error" | default "Não foi possível inscrever agora. Tente novamente." }}';
        msg.className = 'newsletter-msg err';
      }
    } catch (err) {
      msg.textContent = '{{ i18n "newsletter_error" | default "Não foi possível inscrever agora. Tente novamente." }}';
      msg.className = 'newsletter-msg err';
    }
    btn.disabled = false;
  });
})();
</script>
