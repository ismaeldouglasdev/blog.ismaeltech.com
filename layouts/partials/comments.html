{{- /* Comentários via Cloudflare Worker + D1 (substitui giscus) */ -}}
{{- $path := .RelPermalink -}}
<div class="blog-comments" data-path="{{ $path }}">
  <h2 class="blog-comments-title">{{ i18n "comments_title" }}</h2>
  <div class="blog-comments-list"></div>
  <p class="blog-comments-empty">{{ i18n "comments_empty" }}</p>

  <form class="blog-comments-form">
    <div class="blog-comments-row">
      <input type="text" class="blog-comments-input" placeholder="{{ i18n "comments_author_ph" }}" maxlength="60" required />
      <input type="email" class="blog-comments-input" placeholder="{{ i18n "comments_email_ph" }}" />
    </div>
    <textarea class="blog-comments-input" placeholder="{{ i18n "comments_body_ph" }}" maxlength="500" rows="4" required></textarea>
    <div class="blog-comments-turnstile"></div>
    <button type="submit" class="blog-comments-submit" disabled>{{ i18n "comments_submit" }}</button>
    <p class="blog-comments-status"></p>
  </form>
</div>

<style>
.blog-comments { margin-top: 3rem; padding-top: 2rem; border-top: 1px solid var(--border); }
.blog-comments-title { font-size: 1.4rem; margin-bottom: 1.5rem; }
.blog-comments-list { display: flex; flex-direction: column; gap: 1rem; margin-bottom: 1.5rem; }
.blog-comments-empty { color: var(--secondary); font-style: italic; }
.blog-comment { padding: 1rem; border: 1px solid var(--border); border-radius: 8px; background: var(--entry); }
.blog-comment-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 0.4rem; }
.blog-comment-author { font-weight: 600; }
.blog-comment-date { font-size: 0.8rem; color: var(--secondary); margin-left: 0.5rem; }
.blog-comment-delete { background: none; border: none; color: #ef4444; cursor: pointer; font-size: 0.8rem; padding: 0; }
.blog-comment-delete:hover { text-decoration: underline; }
.blog-comment-body { white-space: pre-wrap; word-break: break-word; }
.blog-comments-form { display: flex; flex-direction: column; gap: 0.75rem; }
.blog-comments-row { display: flex; gap: 0.75rem; flex-wrap: wrap; }
.blog-comments-row .blog-comments-input { flex: 1; min-width: 180px; }
.blog-comments-input {
  width: 100%; padding: 0.6rem 0.8rem; border-radius: 6px;
  border: 1px solid var(--border); background: var(--entry); color: var(--primary);
  font: inherit;
}
.blog-comments-input:focus { outline: 2px solid var(--primary); outline-offset: -1px; }
.blog-comments-submit {
  align-self: flex-start; padding: 0.55rem 1.4rem; border: none; border-radius: 6px;
  background: var(--primary); color: var(--theme, #fff); font: inherit; font-weight: 600;
  cursor: pointer;
}
.blog-comments-submit:disabled { opacity: 0.5; cursor: not-allowed; }
.blog-comments-status:empty { display: none; }
.blog-comments-status.ok { color: #22c55e; }
.blog-comments-status.err { color: #ef4444; }
</style>

<script>
(function () {
  var root = document.currentScript.closest('.blog-comments');
  var API = 'https://blog-analytics.y2kgif.workers.dev';
  var SITEKEY = '0x4AAAAAAEqk8S7SDJkzdRsG';
  var path = root.getAttribute('data-path');
  var listEl = root.querySelector('.blog-comments-list');
  var emptyEl = root.querySelector('.blog-comments-empty');
  var form = root.querySelector('.blog-comments-form');
  var inputs = form.querySelectorAll('.blog-comments-input');
  var authorInput = inputs[0], emailInput = inputs[1], bodyInput = inputs[2];
  var tsContainer = root.querySelector('.blog-comments-turnstile');
  var submitBtn = root.querySelector('.blog-comments-submit');
  var statusEl = root.querySelector('.blog-comments-status');
  var token = null, widgetId = null, submitting = false;
  var I18N = {
    submit: {{ i18n "comments_submit" | jsonify }},
    submitting: {{ i18n "comments_submitting" | jsonify }},
    success: {{ i18n "comments_success" | jsonify }},
    error: {{ i18n "comments_error" | jsonify }},
    del: {{ i18n "comments_delete" | jsonify }},
    deleting: {{ i18n "comments_deleting" | jsonify }},
    delConfirm: {{ i18n "comments_delete_confirm" | jsonify }},
    dateLocale: {{ if eq .Lang "en" }}"en-US"{{ else }}"pt-BR"{{ end }}
  };

  function esc(s) {
    var d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function fmtDate(s) {
    return new Date(s).toLocaleDateString(I18N.dateLocale, { day: '2-digit', month: 'short', year: 'numeric' });
  }

  function getDeleteToken(id) {
    try { return localStorage.getItem('blog_comment_' + path + '_' + id); } catch (e) { return null; }
  }

  function render(comments) {
    listEl.innerHTML = '';
    emptyEl.style.display = comments.length ? 'none' : '';
    comments.forEach(function (c) {
      var div = document.createElement('div');
      div.className = 'blog-comment';
      var header = document.createElement('div');
      header.className = 'blog-comment-header';
      var meta = document.createElement('div');
      meta.innerHTML = '<span class="blog-comment-author"></span>' +
        '<span class="blog-comment-date">' + esc(fmtDate(c.created_at)) + '</span>';
      meta.querySelector('.blog-comment-author').textContent = c.author;
      header.appendChild(meta);
      if (getDeleteToken(c.id)) {
        var del = document.createElement('button');
        del.type = 'button';
        del.className = 'blog-comment-delete';
        del.textContent = I18N.del;
        del.addEventListener('click', function () { removeComment(c.id, div); });
        header.appendChild(del);
      }
      var body = document.createElement('div');
      body.className = 'blog-comment-body';
      body.textContent = c.body;
      div.appendChild(header);
      div.appendChild(body);
      listEl.appendChild(div);
    });
  }

  function load() {
    fetch(API + '/api/comments?path=' + encodeURIComponent(path))
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        var results = (d && d.comments && d.comments.results) || (d && d.results) || [];
        render(results);
      })
      .catch(function () {});
  }

  function setStatus(msg, ok) {
    statusEl.textContent = msg || '';
    statusEl.className = 'blog-comments-status' + (msg ? (ok ? ' ok' : ' err') : '');
  }

  function renderTurnstile() {
    if (widgetId !== null || !window.turnstile) return;
    widgetId = window.turnstile.render(tsContainer, {
      sitekey: SITEKEY,
      action: 'blog_comment',
      size: 'compact',
      callback: function (t) { token = t; submitBtn.disabled = submitting; },
      'expired-callback': function () { token = null; submitBtn.disabled = true; },
      'error-callback': function () { token = null; submitBtn.disabled = true; }
    });
    submitBtn.disabled = true;
  }

  function removeComment(id, el) {
    var t = getDeleteToken(id);
    if (!t || !confirm(I18N.delConfirm)) return;
    fetch(API + '/api/comments', {
      method: 'DELETE',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: id, deleteToken: t })
    }).then(function (r) {
      if (r.ok) {
        el.remove();
        try { localStorage.removeItem('blog_comment_' + path + '_' + id); } catch (e) {}
        if (!listEl.children.length) emptyEl.style.display = '';
      }
    }).catch(function () {});
  }

  var tsScript = document.createElement('script');
  tsScript.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit';
  tsScript.async = true;
  tsScript.onload = renderTurnstile;
  document.head.appendChild(tsScript);
  var tsPoll = setInterval(function () {
    if (window.turnstile) { clearInterval(tsPoll); renderTurnstile(); }
  }, 200);

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    if (!token || submitting) return;
    submitting = true;
    submitBtn.disabled = true;
    submitBtn.textContent = I18N.submitting;
    fetch(API + '/api/comments', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        path: path,
        author: authorInput.value.trim(),
        email: emailInput.value.trim() || undefined,
        comment: bodyInput.value.trim(),
        turnstileToken: token
      })
    }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json().catch(function () { return {}; });
    }).then(function (data) {
      if (data && data.deleteToken && data.id) {
        try { localStorage.setItem('blog_comment_' + path + '_' + data.id, data.deleteToken); } catch (e) {}
      }
      authorInput.value = ''; emailInput.value = ''; bodyInput.value = '';
      token = null;
      if (window.turnstile && widgetId !== null) window.turnstile.reset(widgetId);
      submitBtn.disabled = true;
      setStatus(I18N.success, true);
      load();
    }).catch(function () {
      token = null;
      if (window.turnstile && widgetId !== null) window.turnstile.reset(widgetId);
      submitBtn.disabled = true;
      setStatus(I18N.error, false);
    }).then(function () {
      submitting = false;
      submitBtn.textContent = I18N.submit;
    });
  });

  load();
})();
</script>
