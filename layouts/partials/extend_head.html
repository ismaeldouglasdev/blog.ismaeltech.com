<meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f0e0c" media="(prefers-color-scheme: dark)">
{{- $cover := "" -}}
{{- with .Params.cover -}}
  {{- if reflect.IsMap . -}}
    {{- with (or (index . "image") (index . "src") (index . "url")) -}}{{- $cover = . -}}{{- end -}}
  {{- else -}}
    {{- $cover = . -}}
  {{- end -}}
{{- end -}}
{{- if not $cover -}}
<meta property="og:image" content="{{ "images/og-default.png" | absURL }}">
<meta name="twitter:image" content="{{ "images/og-default.png" | absURL }}">
{{- end -}}
<style>
.newsletter-box{position:fixed;right:12px;bottom:12px;z-index:90;width:min(300px,calc(100vw - 24px));max-height:calc(100dvh - 24px);overflow:auto;margin:0;padding:10px 12px 8px;border:1px solid var(--border);border-radius:10px;background:var(--entry);box-shadow:var(--clean-shadow-hover)}
.newsletter-box[hidden]{display:none!important}
.newsletter-close{position:absolute;top:4px;right:4px;width:44px;height:44px;display:grid;place-items:center;border:0;border-radius:8px;background:transparent;color:var(--secondary);font-size:1.25rem;line-height:1;cursor:pointer}
.newsletter-close:hover{background:var(--clean-bg-subtle);color:var(--primary)}
.newsletter-close:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.newsletter-box h3{margin:0 38px 4px 0;font-size:.95rem;line-height:1.3}
.newsletter-box p{margin:0;opacity:.85}
.newsletter-desc{font-size:.78rem;line-height:1.4;max-width:25em}
.newsletter-form{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px}
.newsletter-form input[type=email]{flex:1 1 140px;min-width:0;padding:7px 9px;border:1px solid var(--border);border-radius:8px;background:var(--theme);color:var(--primary);font-size:.82rem}
.newsletter-form button{padding:7px 10px;border:0;border-radius:8px;background:var(--primary);color:var(--theme);font-size:.82rem;font-weight:600;cursor:pointer}
.newsletter-form button:disabled{opacity:.6;cursor:default}
.newsletter-hp{position:absolute;left:-9999px;opacity:0;height:0;width:0}
.newsletter-msg{margin:6px 0 0;font-size:.78rem;line-height:1.4}
.newsletter-msg:empty{display:none}
.newsletter-msg.ok{color:#1b7f3b}
.newsletter-msg.err{color:#b3261e}
@media (max-width:480px){.newsletter-box{left:12px;right:12px;bottom:12px;width:auto;max-height:calc(100dvh - 24px);padding:10px 12px 8px}.newsletter-form input[type=email]{flex-basis:100%}.newsletter-form button{width:100%}}
</style>
